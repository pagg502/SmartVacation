stages:
  - test
  - build
  - deploy

unit_tests:
  stage: test
  image: maven:3.9.6-eclipse-temurin-21
  services:
    - name: mysql:8.0
      alias: mysql
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: full-stack-ecommerce

    #Spring Boot test profile environment variable values
    SPRING_PROFILES_ACTIVE: test
    SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/full-stack-ecommerce?useSSL=false&allowPublicKeyRetrieval=true"
    SPRING_DATASOURCE_USERNAME: root
    SPRING_DATASOURCE_PASSWORD: root

  before_script:
    - apt-get update
    - apt-get install -y default-mysql-client
  script:
    - echo "Waiting for MySQL..."
    - until mysqladmin ping -h mysql --silent; do sleep 1; done

    - echo "Running SQL Script"
    - mysql -h mysql -uroot -proot SmartVacation < EcommerceSpringBootBackend/src/test/java/com/backend/ecommercespringbootbackend/upgrades/create_and_populate_db.sql

    - echo "Running Unit Test"
    - cd EcommerceSpringBootBackend
    - mvn test --batch-mode

build_app:
  stage: build
  image: maven:3.9.6-eclipse-temurin-21
  services:
    - docker:dind

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

  before_script:
    - apt-get update
    - apt-get install -y docker.io

  script:
    - echo "Building Docker image..."
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA Backend

    - echo "Logging into GitLab registry..."
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY

    - echo "Pushing image with commit SHA..."
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

    - echo "Tagging image as latest..."
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest

    - echo "Pushing latest tag..."
    - docker push $CI_REGISTRY_IMAGE:latest

  only:
    - main
    - Working

deploy:
  stage: deploy
  image: alpine:latest

  before_script:
    #Install SSH client
    - apk add --no-cache openssh-client

    #Start ssh-agent
    - eval $(ssh-agent -s)

    #Add private key from GitLab variable to agent
    #Remove CR characters (important for Windows line endings)
    - echo "$EC2_SSH_KEY" | tr -d '\r' | ssh-add -

    #Create .ssh directory and set proper permissions
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    #Scan EC2 host and add to known_hosts to avoid prompt
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

  script:
    #Test SSH connection (optional but recommended)
    - ssh -o StrictHostKeyChecking=yes $EC2_USER@$EC2_HOST "echo connected"

    #Deploy Docker container
    - ssh -o StrictHostKeyChecking=yes $EC2_USER@$EC2_HOST "
      docker login -u $REGISTRY_USER -p $REGISTRY_PASSWORD registry.gitlab.com &&
      docker pull  &&
      docker stop backend || true &&
      docker rm backend || true &&
      docker run -d --name backend -p 8080:8080 -p 80:8080 \
      
      "
  only:
    - main
    - Working




