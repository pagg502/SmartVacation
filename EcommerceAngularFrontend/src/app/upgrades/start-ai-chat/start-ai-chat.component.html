<div class="popup-overlay" (click)="close()">
  <div class="popup-window" (click)="$event.stopPropagation()">

    <div class="popup-header">
      <div class="header-info">
        <div class="status-dot"></div>
        <h2>Travel Agent on Duty!</h2>
      </div>
      <button class="icon-close" (click)="close()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <div class="chat-container" #scrollContainer>
      <div *ngFor="let msg of messages" [ngClass]="['message-wrapper', msg.type]">
        <div class="message-bubble">
          <!-- <div class="message-content">{{ msg.text }}</div>  -->
          <div class="message-content" [innerHTML]="msg.text"></div>
        </div>
      </div>

      <div *ngIf="isSubmitting" class="message-wrapper received">
        <div class="message-bubble typing">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <input [(ngModel)]="currentInput"
               (keyup.enter)="onSubmit()"
               placeholder="Ask Nova..."
               autocomplete="off">
        <button class="send-btn" [disabled]="!currentInput.trim() || isSubmitting" (click)="onSubmit()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>

  </div>
</div>
